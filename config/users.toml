# config/users.toml — 로컬 데모 계정 (가상 인물). 모든 데모 계정의 비밀번호: patentlab-demo
#
# 배포할 때는 이 파일을 쓰지 않는다: USERS_TOML 시크릿(이 형식의 TOML 원문)에 실제 계정을 넣는다.
# APP_ENV=production에서 demo = true인 계정 파일이면 앱이 시작하지 않는다 (src/security/auth.py).
# 비밀번호 해시 만들기: python -m src.security.auth hash
#
# role: guest(방문자) | researcher(연구원) | ip(특허팀) | admin(시스템 관리자 — 운영 현황만, 문서 열람 권한은 따로)
# teams: 소속 팀 (data/internal/catalog.yaml의 teams), daily_limit: 하루 LLM 요청 상한
demo = true

