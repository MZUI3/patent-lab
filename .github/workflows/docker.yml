name: Docker build

# Dockerfile·의존성이 바뀔 때만 이미지가 빌드되고 앱이 뜨는지 확인한다 (모델 미리 받기는 생략해 시간을 줄인다)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, requirements.txt]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg PRELOAD_MODEL=0 -t patent-lab:ci .
      - name: Start and check health
        run: |
          docker run -d --name app -p 8501:8501 patent-lab:ci
          for i in $(seq 1 36); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 5
          done
          docker logs app
          exit 1
